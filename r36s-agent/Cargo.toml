[package]
name = "r36s-agent"
version = "0.1.0"
edition = "2021"
authors = ["DevBridge Team"]
description = "Lightweight background daemon for R36S ArkOS (telemetry, framebuffer streaming and devtools)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lz4_flex = "0.11"
memmap2 = "0.9"
sha2 = "0.10"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
